<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Equipements</title>
        <link rel="stylesheet" th:href="@{/css/equipements.css}">
        <link rel="stylesheet" th:href="@{/css/en-tete.css}">
    </head>
    <body>
        <header th:replace="~{fragments/en-tete :: enTete}"></header>
        <main>
            <div>
                <h1>équipements</h1>
                <p>espace pour surveiller chaque équipement</p>
                <form th:action="@{/}" method="get" class="search">
                    <input name="search" type="search" th:value="${search}" placeholder="rechercher un équipement par référence" id="searchbar"/>

                    <select name="stationId" id="stations" onchange="this.form.submit()">
                        <option value="">filtrer par station</option>
                        <option th:each="station : ${stations}" th:value="${station.id}" th:text="${station.nomStation}" th:selected="${station.id == selectedStationId}">station</option>
                    </select>
                </form>
            </div>
            <div class="tableau-equipements">
                <div class="equipement-box" th:each="e : ${equipements}">
                    <div class="box-title">
                        <p>equipement #<span th:text="${e.reference}">0</span></p>
                    </div>
                    <div class="box-content">
                        <p th:text="${e.description}">description</p>
                        <p>type : <span th:text="${e.type}"></span></p>
                        <p>état : <span th:text="${e.etatFontionnement}"></span></p>
                    </div>
                </div>
            </div>

            <p th:if="${#lists.isEmpty(equipements)}">aucun équipement est en base :(</p>
        </main>
    </body>
</html>
