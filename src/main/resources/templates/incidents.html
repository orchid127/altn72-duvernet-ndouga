<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Incidents</title>
        <link rel="stylesheet" th:href="@{/css/incidents.css}">
        <link rel="stylesheet" th:href="@{/css/en-tete.css}">
        <link rel="stylesheet" th:href="@{/css/modal-incident.css}">
    </head>
    <body>
        <header th:replace="~{fragments/en-tete :: enTete}"></header>
        <main class="">
            <div class="creation">
                <div id="declarer-button">
                    <button type="button" id="open-modal">déclarer un incident</button>
                </div>
                <div th:replace="~{fragments/modal-incident :: modal-incident}"></div>
            </div>
            <div class="historique">
                <h1>historique incidents résolus</h1>
                <div class="grid-incidents">
                    <div th:each="i : ${lstIncidents}" class="box-incident">
                        <div class="incident-title">
                            <p>incident #<span th:text="${i.id}" >id</span></p>
                        </div>
                        <div class="incident-content">
                            <p th:text="${i.description}">description</p>
                            <p>date ouverture : <span th:text="${i.dateOuverture}">date</span></p>
                            <p>date fermeture : <span th:text="${i.dateResolution}">date</span></p>

                            <select>
                                <option>noter prestataire</option>
                                <option value="1">1/5</option>
                                <option value="2">2/5</option>
                                <option value="3">3/5</option>
                                <option value="4">4/5</option>
                                <option value="5">5/5</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
