<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<header  class="en-tete">
    <div class="utilisateur" th:if="${utilisateurConnecte != null}">
        <p>
            Bonjour
            <span th:text="${utilisateurConnecte.prenom}">Prénom</span> !
            (<span th:text="${utilisateurConnecte.profil}" class="profil">profil</span>) ✧˖°
        </p>
    </div>

    <div class="liens">
        <a class="nom-application" th:href="@{/}">equipements</a>
        <a class="nom-application" th:href="@{/incident}">incidents</a>
        <a class="nom-application" th:href="@{/dashboard}">dashboard</a>
        <form th:action="@{/deconnexion}" method="post" class="form-deconnexion">
            <button type="submit" class="bouton-lien">Déconnectez-vous</button>
        </form>
    </div>
</header>

<div class="modal" th:fragment="modal-incident">
    <div class="modal-box">
        <div id="title-bar">
            <p>modify the vulnerability information</p>
            <div id="close">x</div>
        </div>
        <form>
            <label for="threat-level">edit threat level (from 1 to 10)</label>
            <input id="threat-level" type="number" min="1" max="10" placeholder="how bad does it get ?">

            <label for="type">edit type</label>
            <input type="text">


            <label for="type">assign an asset</label>
            <select id="type">
                <option value="val"></option>
            </select>

            <label for="desc">edit description</label>
            <textarea id="desc" type="text" placeholder="description of the vulnerability"></textarea>
            <button type="button">save ⋆.°⭑</button>
        </form>
    </div>
</div>
</body>
</html>
